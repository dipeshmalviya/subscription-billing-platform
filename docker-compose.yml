version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: billing
      POSTGRES_PASSWORD: billing
      POSTGRES_MULTIPLE_DATABASES: subscription_db,payment_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U billing"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181

  kafka:
    image: confluentinc/cp-kafka:7.6.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1

  subscription-migrate:
    build:
      context: ./services/subscription
    entrypoint: ["migrate", "-path", "/app/db/migrations", "-database", "postgres://billing:billing@postgres:5432/subscription_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  payment-migrate:
    build:
      context: ./services/payment
    entrypoint: ["migrate", "-path", "/app/db/migrations", "-database", "postgres://billing:billing@postgres:5432/payment_db?sslmode=disable", "up"]
    depends_on:
      postgres:
        condition: service_healthy

  subscription-service:
    build:
      context: ./services/subscription
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      POSTGRES_URI: postgres://billing:billing@postgres:5432/subscription_db?sslmode=disable
      REDIS_ADDR: redis:6379
      KAFKA_BROKERS: kafka:9092
      SECRET_KEY: dev_secret_key_change_me
      SECRET_REFRESH_KEY: dev_refresh_secret_change_me
      ALLOWED_ORIGINS: http://localhost:5173
      PAYMENT_SERVICE_ADDR: payment-service:9090
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      subscription-migrate:
        condition: service_completed_successfully

  payment-service:
    build:
      context: .
      dockerfile: services/payment/Dockerfile
    ports:
      - "9090:9090"
    environment:
      PORT: 9090
      POSTGRES_URI: postgres://billing:billing@postgres:5432/payment_db?sslmode=disable
      KAFKA_BROKERS: kafka:9092
    depends_on:
      postgres:
        condition: service_healthy
      payment-migrate:
        condition: service_completed_successfully

  notification-service:
    build:
      context: ./services/notification
    ports:
      - "8082:8082"
    environment:
      PORT: 8082
      KAFKA_BROKERS: kafka:9092
    depends_on:
      - kafka

volumes:
  pgdata: